
# WanNowの本番環境へのデプロイ設定
name: Deploy WanNow

# GitHubのActions画面から手動で実行する
on:
  workflow_dispatch:

# デプロイ処理を定義する
jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # GitHub Actionsの実行環境にコードを取得する
      - name: Checkout code
        uses: actions/checkout@v4

      # SSH接続に必要な秘密鍵を設定する
      - name: Set up SSH
        env:
          PRIVATE_KEY: ${{ secrets.PRIVATE_KEY }}
          HOST_NAME: ${{ secrets.HOST_NAME }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s %s\n' "$HOST_NAME" 'ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGMsbDulAqqPOYaD02JRguK130rihd7/NCqsTTU7zIjV' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts


      # 本番環境へのSSH接続を確認する
      - name: Test SSH connection
        env:
          HOST_NAME: ${{ secrets.HOST_NAME }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$USER_NAME@$HOST_NAME" "echo 'SSH connection successful'"

      # 本番環境のアプリ配置先を確認する
      - name: Check production directory
        env:
          HOST_NAME: ${{ secrets.HOST_NAME }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$USER_NAME@$HOST_NAME" "cd /home/ubuntu/wannow && pwd && git status --short"

      # 本番環境のGitブランチを確認する
      - name: Check production branch
        env:
          HOST_NAME: ${{ secrets.HOST_NAME }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$USER_NAME@$HOST_NAME" \
            "cd /home/ubuntu/wannow && test \"\$(git branch --show-current)\" = main && git status --short"

      # 本番環境の現在のコミットを確認する
      - name: Check production commit
        env:
          HOST_NAME: ${{ secrets.HOST_NAME }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$USER_NAME@$HOST_NAME" \
            "cd /home/ubuntu/wannow && git log -1 --oneline"

      # 本番環境に未コミットの変更がないことを確認する
      - name: Check clean working tree
        env:
          HOST_NAME: ${{ secrets.HOST_NAME }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$USER_NAME@$HOST_NAME" \
            "cd /home/ubuntu/wannow && test -z \"\$(git status --porcelain)\""

      # GitHubのmainブランチを本番環境に反映する
      - name: Update production code
        env:
          HOST_NAME: ${{ secrets.HOST_NAME }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$USER_NAME@$HOST_NAME" \
            "cd /home/ubuntu/wannow && git pull --ff-only origin main"

      # 本番データベースのマイグレーションを実行する
      - name: Migrate production database
        env:
          HOST_NAME: ${{ secrets.HOST_NAME }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$USER_NAME@$HOST_NAME" \
            "cd /home/ubuntu/wannow && RAILS_ENV=production bin/rails db:migrate"

      # 本番環境のPumaを再起動する
      - name: Restart Puma
        env:
          HOST_NAME: ${{ secrets.HOST_NAME }}
          USER_NAME: ${{ secrets.USER_NAME }}
        run: |
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes \
            "$USER_NAME@$HOST_NAME" \
            "sudo -n systemctl restart puma && systemctl is-active --quiet puma"
