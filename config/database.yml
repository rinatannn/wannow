
# SQLiteの基本設定
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

# 開発環境
development:
  <<: *default
  database: storage/development.sqlite3

# テスト環境
test:
  <<: *default
  database: storage/test.sqlite3

# 本番環境
production:
  primary: &primary_production
    adapter: mysql2
    encoding: utf8mb4
    charset: utf8mb4
    collation: utf8mb4_general_ci
    pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
    database: <%= ENV["DB_DATABASE"] %>
    username: <%= ENV["DB_USERNAME"] %>
    password: <%= ENV["DB_PASSWORD"] %>
    host: <%= ENV["DB_HOST"] %>
    port: 3306

  # キャッシュ用データベース
  cache:
    <<: *primary_production
    database: wannow_production_cache
    migrations_paths: db/cache_migrate

  # ジョブ管理用データベース
  queue:
    <<: *primary_production
    database: wannow_production_queue
    migrations_paths: db/queue_migrate

  # Action Cable用データベース
  cable:
    <<: *primary_production
    database: wannow_production_cable
    migrations_paths: db/cable_migrate
